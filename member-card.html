<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>会員証 — MIKOSHIYA</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
    background: #f0f0eb;
    min-height: 100vh;
    padding: 20px 16px;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    max-width: 420px;
    margin-left: auto;
    margin-right: auto;
  }
  .site-name { font-size: 18px; font-weight: 700; color: #1a1a1a; }
  .btn-logout {
    font-size: 12px; color: #888; background: none;
    border: none; cursor: pointer; padding: 4px 8px;
  }

  /* 会員証カード */
  .card {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    border-radius: 20px;
    padding: 28px 24px;
    max-width: 420px;
    margin: 0 auto 20px;
    color: #fff;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    top: -40px; right: -40px;
    width: 140px; height: 140px;
    border-radius: 50%;
    background: rgba(255,255,255,0.04);
  }
  .card-header { font-size: 11px; letter-spacing: 0.2em; color: #aab; margin-bottom: 16px; }
  .member-name { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
  .member-id { font-size: 13px; color: #aab; margin-bottom: 4px; }
  .member-plan {
    display: inline-block;
    font-size: 11px;
    padding: 2px 10px;
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 20px;
    color: #dde;
    margin-bottom: 20px;
  }
  .qr-area {
    background: #fff;
    border-radius: 12px;
    padding: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 160px;
    height: 160px;
    margin: 0 auto;
  }
  .qr-area canvas { max-width: 128px; max-height: 128px; }
  .card-footer {
    margin-top: 16px;
    font-size: 11px;
    color: #667;
    text-align: center;
    letter-spacing: 0.1em;
  }

  /* 利用状況 */
  .section {
    background: #fff;
    border-radius: 14px;
    padding: 20px;
    max-width: 420px;
    margin: 0 auto 16px;
  }
  .section-title {
    font-size: 12px;
    font-weight: 600;
    color: #888;
    letter-spacing: 0.1em;
    margin-bottom: 14px;
  }
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
  }
  .stat { text-align: center; }
  .stat-num { font-size: 24px; font-weight: 700; color: #1a1a1a; }
  .stat-label { font-size: 11px; color: #888; margin-top: 2px; }

  /* 最近の来訪 */
  .visit-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid #f0f0f0;
    font-size: 14px;
  }
  .visit-item:last-child { border-bottom: none; }
  .visit-date { color: #555; }
  .visit-time { font-size: 12px; color: #aaa; }
  .visit-fee { font-weight: 600; color: #1a1a1a; }

  .nav-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: #fff;
    border-top: 1px solid #eee;
    display: flex;
    justify-content: space-around;
    padding: 8px 0 max(8px, env(safe-area-inset-bottom));
  }
  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    font-size: 10px;
    color: #888;
    text-decoration: none;
    padding: 4px 16px;
  }
  .nav-item.active { color: #0f3460; }
  .nav-item span { font-size: 20px; }
  .pb { padding-bottom: 80px; }

  #loading-overlay {
    position: fixed; inset: 0;
    background: #f0f0eb;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; color: #888;
    z-index: 100;
  }
</style>
</head>
<body>
<div id="loading-overlay">読み込み中...</div>

<div id="app" style="display:none">
  <header>
    <div class="site-name">MIKOSHIYA</div>
    <div style="display:flex;gap:8px;align-items:center">
      <a href="staff.html" id="btnStaffRoom" style="display:none;font-size:12px;color:#0f3460;text-decoration:none;background:#e8f0fe;padding:4px 10px;border-radius:8px;font-weight:600">🏠 スタッフルーム</a>
      <button class="btn-logout" id="btnLogout">ログアウト</button>
    </div>
  </header>

  <!-- 会員証 -->
  <div class="card">
    <div class="card-header">MEMBER CARD</div>
    <div class="member-name" id="memberName">—</div>
    <div class="member-id" id="memberId">—</div>
    <div class="member-plan" id="memberPlan">—</div>
    <div class="qr-area">
      <div id="qrCanvas"></div>
    </div>
    <div class="card-footer">入退室時にスタッフへ提示</div>
  </div>

  <!-- 今月の利用状況 -->
  <div class="section">
    <div class="section-title">今月の利用状況</div>
    <div class="stats-grid">
      <div class="stat">
        <div class="stat-num" id="statVisits">—</div>
        <div class="stat-label">来訪回数</div>
      </div>
      <div class="stat">
        <div class="stat-num" id="statHours">—</div>
        <div class="stat-label">利用時間(h)</div>
      </div>
      <div class="stat">
        <div class="stat-num" id="statTotal">—</div>
        <div class="stat-label">合計(¥)</div>
      </div>
    </div>
  </div>

  <!-- 最近の来訪 -->
  <div class="section pb">
    <div class="section-title">最近の来訪</div>
    <div id="visitList">データなし</div>
  </div>
</div>

<!-- ナビ -->
<nav class="nav-bar">
  <a href="member-card.html" class="nav-item active">
    <span>🪪</span>会員証
  </a>
  <a href="order.html" class="nav-item">
    <span>🛒</span>注文
  </a>
</nav>

<script>
const SUPABASE_URL = 'https://ashoqzwxgaovepclbawf.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFzaG9xend4Z2FvdmVwY2xiYXdmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2OTk2MTMsImV4cCI6MjEwMTI3NTYxM30.Ke1Fa8MSTwj3OFH5mrh2ViPFCq4GUpYQh5vegyGbMLQ';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { location.href = 'index.html'; return; }

  const user = session.user;

  // members テーブルから取得
  const { data: member, error } = await sb
    .from('members')
    .select('*')
    .eq('email', user.email)
    .single();

  document.getElementById('loading-overlay').style.display = 'none';
  document.getElementById('app').style.display = 'block';

  if (!member) {
    // 未登録会員
    document.getElementById('memberName').textContent = user.user_metadata?.full_name || user.email;
    document.getElementById('memberId').textContent = '（未登録 — スタッフへお声がけください）';
    document.getElementById('memberPlan').textContent = '—';
    // QRに email を入れる
    new QRCode(document.getElementById('qrCanvas'), { text: user.email, width: 128, height: 128 });
    return;
  }

  // 表示
  document.getElementById('memberName').textContent = member.name || user.user_metadata?.full_name || '—';
  document.getElementById('memberId').textContent = member.id;
  document.getElementById('memberPlan').textContent = member.plan === 'monthly' ? '月額プラン' : 'ドロップイン';

  // スタッフ・オーナーは戻るボタンを表示
  if (['スタッフ', 'オーナー'].includes(member.rank)) {
    document.getElementById('btnStaffRoom').style.display = 'inline-block';
  }

  // QRコード生成（会員ID）
  new QRCode(document.getElementById('qrCanvas'), { text: member.id, width: 128, height: 128 });

  // 今月の来訪データ
  const now = new Date();
  const monthStart = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().split('T')[0];

  const { data: visits } = await sb
    .from('visits')
    .select('*')
    .eq('member_id', member.id)
    .gte('date', monthStart)
    .order('date', { ascending: false });

  if (visits && visits.length > 0) {
    const totalMinutes = visits.reduce((s, v) => s + (v.stay_minutes || 0), 0);
    const totalYen = visits.reduce((s, v) => s + (v.total_yen || 0), 0);

    document.getElementById('statVisits').textContent = visits.length;
    document.getElementById('statHours').textContent = (totalMinutes / 60).toFixed(1);
    document.getElementById('statTotal').textContent = totalYen.toLocaleString();

    // 最近5件
    document.getElementById('visitList').innerHTML = visits.slice(0, 5).map(v => `
      <div class="visit-item">
        <div>
          <div class="visit-date">${v.date}</div>
          <div class="visit-time">${v.enter_time?.slice(0,5) || '—'} 〜 ${v.exit_time?.slice(0,5) || '滞在中'}</div>
        </div>
        <div class="visit-fee">¥${v.total_yen.toLocaleString()}</div>
      </div>
    `).join('');
  } else {
    document.getElementById('statVisits').textContent = '0';
    document.getElementById('statHours').textContent = '0';
    document.getElementById('statTotal').textContent = '0';
    document.getElementById('visitList').textContent = '今月の来訪はありません';
  }
}

document.getElementById('btnLogout').addEventListener('click', async () => {
  await sb.auth.signOut();
  location.href = 'index.html';
});

init();
</script>
</body>
</html>
