<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIKOSHIYA — ログイン</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
    background:
      repeating-linear-gradient(
        135deg,
        rgba(255,255,255,0.012) 0,
        rgba(255,255,255,0.012) 1px,
        transparent 1px,
        transparent 3px
      ),
      radial-gradient(
        ellipse 120% 60% at 50% -10%,
        #24365f 0%,
        #16223f 38%,
        #0a1428 75%,
        #05090f 100%
      );
    background-attachment: fixed;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 48px 40px;
    max-width: 360px;
    width: 90%;
    text-align: center;
    box-shadow: 0 2px 24px rgba(0,0,0,0.08);
  }
  .logo {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: #1a1a1a;
    margin-bottom: 8px;
  }
  .subtitle {
    font-size: 13px;
    color: #888;
    margin-bottom: 40px;
  }
  .btn-google {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
    padding: 14px 20px;
    border: 1.5px solid #dadce0;
    border-radius: 10px;
    background: #fff;
    font-size: 15px;
    font-weight: 500;
    color: #3c4043;
    cursor: pointer;
    transition: background 0.15s, box-shadow 0.15s;
    text-decoration: none;
  }
  .btn-google:hover {
    background: #f8f8f8;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .btn-google svg { flex-shrink: 0; }
  .btn-line {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
    padding: 14px 20px;
    border: none;
    border-radius: 10px;
    background: #06C755;
    font-size: 15px;
    font-weight: 500;
    color: #fff;
    cursor: pointer;
    transition: opacity 0.15s;
    text-decoration: none;
    margin-top: 12px;
  }
  .btn-line:hover { opacity: 0.9; }
  .btn-line svg { flex-shrink: 0; }
  .loading {
    margin-top: 24px;
    font-size: 13px;
    color: #888;
    display: none;
  }
  .error-msg {
    margin-top: 16px;
    font-size: 13px;
    color: #d93025;
    display: none;
  }
  .version { margin-top: 40px; font-size: 11px; color: #ccc; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">MIKOSHIYA</div>
  <div class="subtitle">コワーキングスペース 会員ポータル</div>

  <button class="btn-google" id="btnGoogle">
    <svg width="18" height="18" viewBox="0 0 18 18">
      <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/>
      <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
      <path fill="#FBBC05" d="M3.964 10.707A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.707V4.961H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.039l3.007-2.332z"/>
      <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.961L3.964 7.293C4.672 5.163 6.656 3.58 9 3.58z"/>
    </svg>
    Googleでログイン
  </button>

  <button class="btn-line" id="btnLine">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
      <path d="M12 2C6.477 2 2 5.85 2 10.5c0 4.16 3.51 7.65 8.26 8.35.32.07.76.21.87.49.1.25.06.65.03.9l-.14.87c-.04.25-.2 1 .87.55 1.07-.46 5.77-3.4 7.87-5.83C21.15 13.9 22 12.3 22 10.5 22 5.85 17.523 2 12 2z" fill="#fff"/>
    </svg>
    LINEでログイン
  </button>

  <div class="loading" id="loading">ログイン処理中...</div>
  <div class="error-msg" id="errorMsg"></div>
  <div class="version">MIKOSHIYA OS v1.0</div>
</div>

<script>
const SUPABASE_URL = 'https://ashoqzwxgaovepclbawf.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFzaG9xend4Z2FvdmVwY2xiYXdmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2OTk2MTMsImV4cCI6MjEwMTI3NTYxM30.Ke1Fa8MSTwj3OFH5mrh2ViPFCq4GUpYQh5vegyGbMLQ';

const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let redirecting = false;

function showLoading(msg) {
  const el = document.getElementById('loading');
  el.textContent = msg;
  el.style.display = 'block';
}

function showError(msg) {
  document.getElementById('loading').style.display = 'none';
  const em = document.getElementById('errorMsg');
  em.textContent = msg;
  em.style.display = 'block';
}

async function redirect(user) {
  if (redirecting) return;
  redirecting = true;

  showLoading('ランク確認中...');

  try {
    const isLine = user.user_metadata?.provider === 'line';
    let member, error;

    if (isLine) {
      const lineId = user.user_metadata?.sub;
      console.log('[MIKOSHIYA] LINE login, lineId:', lineId);
      ({ data: member, error } = await sb
        .from('members')
        .select('rank, active')
        .eq('line_id', lineId)
        .maybeSingle());
    } else {
      ({ data: member, error } = await sb
        .from('members')
        .select('rank, active')
        .eq('email', user.email)
        .maybeSingle());
    }

    console.log('[MIKOSHIYA] isLine:', isLine, 'email:', user.email, 'member:', member, 'error:', error);

    if (member && (member.rank === 'スタッフ' || member.rank === 'オーナー')) {
      showLoading('スタッフページへ移動中...');
      location.href = 'staff.html';
    } else {
      showLoading('会員ページへ移動中...');
      location.href = 'member-card.html';
    }
  } catch (e) {
    console.error('[MIKOSHIYA] redirect error:', e);
    redirecting = false;
    showError('エラー: ' + e.message);
  }
}

// onAuthStateChange だけで統一（INITIAL_SESSION + SIGNED_IN をカバー）
sb.auth.onAuthStateChange(async (event, session) => {
  console.log('[MIKOSHIYA] auth event:', event, 'email:', session?.user?.email);
  if (session && (event === 'SIGNED_IN' || event === 'INITIAL_SESSION')) {
    redirect(session.user);
  }
});

document.getElementById('btnGoogle').addEventListener('click', async () => {
  showLoading('ログイン処理中...');
  document.getElementById('errorMsg').style.display = 'none';

  const base = location.origin + location.pathname.replace(/\/[^/]*$/, '/');
  const redirectTo = base + 'index.html';
  console.log('[MIKOSHIYA] redirectTo:', redirectTo);

  const { error } = await sb.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo }
  });

  if (error) {
    showError('エラー: ' + error.message);
  }
});

document.getElementById('btnLine').addEventListener('click', () => {
  showLoading('LINEへ移動中...');
  document.getElementById('errorMsg').style.display = 'none';

  const params = new URLSearchParams({
    response_type: 'code',
    client_id: '2009333479',
    redirect_uri: 'https://ashoqzwxgaovepclbawf.supabase.co/functions/v1/line-callback',
    state: 'index.html',
    scope: 'openid profile'
  });
  location.href = 'https://access.line.me/oauth2/v2.1/authorize?' + params.toString();
});
</script>
</body>
</html>
