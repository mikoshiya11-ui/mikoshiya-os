<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>入室 — MIKOSHIYA</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
    background: #f5f5f0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 48px 40px;
    max-width: 360px;
    width: 90%;
    text-align: center;
    box-shadow: 0 2px 24px rgba(0,0,0,0.08);
  }
  .logo {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: #1a1a1a;
    margin-bottom: 8px;
  }
  .subtitle {
    font-size: 13px;
    color: #888;
    margin-bottom: 40px;
  }
  .btn-google {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
    padding: 14px 20px;
    border: 1.5px solid #dadce0;
    border-radius: 10px;
    background: #fff;
    font-size: 15px;
    font-weight: 500;
    color: #3c4043;
    cursor: pointer;
    transition: background 0.15s, box-shadow 0.15s;
    text-decoration: none;
  }
  .btn-google:hover {
    background: #f8f8f8;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .btn-google svg { flex-shrink: 0; }
  .btn-line {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
    padding: 14px 20px;
    border: none;
    border-radius: 10px;
    background: #06C755;
    font-size: 15px;
    font-weight: 500;
    color: #fff;
    cursor: pointer;
    transition: opacity 0.15s;
    text-decoration: none;
    margin-top: 12px;
  }
  .btn-line:hover { opacity: 0.9; }
  .btn-line svg { flex-shrink: 0; }
  .loading {
    margin-top: 24px;
    font-size: 13px;
    color: #888;
    display: none;
  }
  .error-msg {
    margin-top: 16px;
    font-size: 13px;
    color: #d93025;
    display: none;
  }
  .version { margin-top: 40px; font-size: 11px; color: #ccc; }

  .result-icon { font-size: 48px; margin-bottom: 16px; }
  .result-title { font-size: 20px; font-weight: 700; color: #1a1a1a; margin-bottom: 8px; }
  .result-msg { font-size: 14px; color: #555; line-height: 1.6; margin-bottom: 8px; }
  .result-time { font-size: 12px; color: #aaa; margin-bottom: 28px; }
  .btn-link {
    display: block;
    width: 100%;
    padding: 12px 20px;
    border: 1.5px solid #dadce0;
    border-radius: 10px;
    background: #fff;
    font-size: 14px;
    font-weight: 500;
    color: #3c4043;
    text-decoration: none;
    cursor: pointer;
  }

  /* ===== 新規会員セルフ登録カード（RPG風・他カードとは意図的に差別化） ===== */
  #registerCard {
    background:
      radial-gradient(ellipse 120% 80% at 50% -10%, #24365f 0%, #16223f 45%, #0a1428 100%);
    border: 2px solid #d4af37;
    box-shadow: 0 18px 50px rgba(0,0,0,.45), inset 0 0 0 1px rgba(243,217,123,.18);
  }
  .reg-badge {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.16em;
    color: #f3d97b;
    margin-bottom: 14px;
    text-shadow: 0 1px 3px rgba(0,0,0,.5);
  }
  #registerCard .result-icon { margin-bottom: 10px; }
  #registerCard .result-title { color: #fff; text-shadow: 0 2px 5px rgba(0,0,0,.5); }
  #registerCard .result-msg { color: #c9d3ec; margin-bottom: 20px; }
  .reg-input {
    width: 100%;
    padding: 14px 16px;
    margin-bottom: 14px;
    border: 1.5px solid #d4af37;
    border-radius: 10px;
    background: rgba(255,255,255,.96);
    font-size: 15px;
    text-align: center;
    color: #16213e;
    font-weight: 600;
  }
  .reg-input:focus {
    outline: none;
    border-color: #f3d97b;
    box-shadow: 0 0 0 3px rgba(243,217,123,.28);
  }
  .btn-register {
    width: 100%;
    padding: 14px;
    border: 2px solid #d4af37;
    border-radius: 10px;
    background: linear-gradient(180deg, #f6e27a, #d4af37);
    color: #1c2c52;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 0.05em;
    cursor: pointer;
    box-shadow: 0 3px 0 #a9821f, 0 5px 10px rgba(0,0,0,.3);
    transition: transform 0.1s, box-shadow 0.1s, opacity 0.15s;
  }
  .btn-register:active {
    transform: translateY(3px);
    box-shadow: 0 0 0 #a9821f;
  }
  .btn-register:disabled {
    opacity: .6;
    cursor: not-allowed;
  }
  #registerCard .error-msg { margin-top: 14px; }
</style>
</head>
<body>

<div class="card" id="loginCard" style="display:none">
  <div class="logo">MIKOSHIYA</div>
  <div class="subtitle">入室チェックイン</div>

  <button class="btn-google" id="btnGoogle">
    <svg width="18" height="18" viewBox="0 0 18 18">
      <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/>
      <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
      <path fill="#FBBC05" d="M3.964 10.707A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.707V4.961H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.039l3.007-2.332z"/>
      <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.961L3.964 7.293C4.672 5.163 6.656 3.58 9 3.58z"/>
    </svg>
    Googleでログイン
  </button>

  <button class="btn-line" id="btnLine">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
      <path d="M12 2C6.477 2 2 5.85 2 10.5c0 4.16 3.51 7.65 8.26 8.35.32.07.76.21.87.49.1.25.06.65.03.9l-.14.87c-.04.25-.2 1 .87.55 1.07-.46 5.77-3.4 7.87-5.83C21.15 13.9 22 12.3 22 10.5 22 5.85 17.523 2 12 2z" fill="#fff"/>
    </svg>
    LINEでログイン
  </button>

  <div class="loading" id="loading">ログイン処理中...</div>
  <div class="error-msg" id="errorMsg"></div>
  <div class="version">MIKOSHIYA OS v1.0</div>
</div>

<div class="card" id="processingCard">
  <div class="logo">MIKOSHIYA</div>
  <div class="loading" style="display:block;margin-top:20px">確認中...</div>
</div>

<div class="card" id="resultCard" style="display:none">
  <div class="result-icon" id="resultIcon">✅</div>
  <div class="result-title" id="resultTitle">—</div>
  <div class="result-msg" id="resultMsg">—</div>
  <div class="result-time" id="resultTime"></div>
  <a href="member-card.html" class="btn-link">会員証を見る</a>
</div>

<div class="card" id="registerCard" style="display:none">
  <div class="reg-badge">✦ NEW ADVENTURER ✦</div>
  <div class="result-icon">🗺️</div>
  <div class="result-title">ようこそ、はじめての方ですね</div>
  <div class="result-msg">お名前を入力してください</div>
  <input type="text" id="registerName" class="reg-input" placeholder="お名前" autocomplete="off">
  <button class="btn-register" id="btnRegister">登録して入室する</button>
  <div class="error-msg" id="registerError"></div>
</div>

<script>
const SUPABASE_URL = 'https://ashoqzwxgaovepclbawf.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFzaG9xend4Z2FvdmVwY2xiYXdmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2OTk2MTMsImV4cCI6MjEwMTI3NTYxM30.Ke1Fa8MSTwj3OFH5mrh2ViPFCq4GUpYQh5vegyGbMLQ';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let handled = false;
let pendingUser = null;

// 日本時間（Asia/Tokyo）基準でvisits.dateへ保存する日付を生成する（Phase 6.5）
function getJSTDateString(d = new Date()) {
  return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit' }).format(d);
}

function showLoginButtons() {
  document.getElementById('processingCard').style.display = 'none';
  document.getElementById('loginCard').style.display = 'block';
}

function showLoading(msg) {
  const el = document.getElementById('loading');
  if (el) { el.textContent = msg; el.style.display = 'block'; }
}

function showError(msg) {
  document.getElementById('loading').style.display = 'none';
  const em = document.getElementById('errorMsg');
  em.textContent = msg;
  em.style.display = 'block';
}

function showResult(icon, title, msg, time) {
  document.getElementById('processingCard').style.display = 'none';
  document.getElementById('loginCard').style.display = 'none';
  document.getElementById('registerCard').style.display = 'none';
  document.getElementById('resultIcon').textContent = icon;
  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultMsg').textContent = msg;
  document.getElementById('resultTime').textContent = time || '';
  document.getElementById('resultCard').style.display = 'block';
}

function showRegisterForm() {
  document.getElementById('processingCard').style.display = 'none';
  document.getElementById('loginCard').style.display = 'none';
  document.getElementById('resultCard').style.display = 'none';
  document.getElementById('registerCard').style.display = 'block';
  document.getElementById('registerName').focus();
}

// 新規会員のセルフ登録（見つからなかった場合のみ呼ばれる）。
// membersテーブルへのINSERTはSupabase側のRLSで「rank=一般 / active=true / plan=dropin、
// かつemail or line_idが自分自身のJWTと一致する場合のみ」に制限されているため、
// 他人になりすました登録や権限昇格はできない。会員IDはDB側のトリガーで自動採番されるため、
// クライアントから他会員の一覧を読み取る必要がなく、他会員の情報は一切やり取りしない。
async function submitRegister() {
  const btn = document.getElementById('btnRegister');
  const nameInput = document.getElementById('registerName');
  const name = nameInput.value.trim();
  const errEl = document.getElementById('registerError');
  errEl.style.display = 'none';

  if (!name) {
    errEl.textContent = 'お名前を入力してください';
    errEl.style.display = 'block';
    return;
  }
  if (!pendingUser) return;

  btn.disabled = true;
  btn.textContent = '登録中...';

  const { user, isLine } = pendingUser;
  const row = {
    name,
    plan: 'dropin',
    rank: '一般',
    active: true,
    email: isLine ? null : user.email,
    line_id: isLine ? (user.user_metadata?.sub || null) : null
  };

  const { data: inserted, error } = await sb.from('members').insert(row).select().maybeSingle();

  if (error || !inserted) {
    btn.disabled = false;
    btn.textContent = '登録して入室する';
    errEl.textContent = '登録に失敗しました。もう一度お試しください。';
    errEl.style.display = 'block';
    return;
  }

  const today = getJSTDateString();
  const now = new Date();
  const { error: visitError } = await sb.from('visits').insert({
    member_id: inserted.id,
    date: today,
    enter_time: now.toTimeString().split(' ')[0]
  });

  if (visitError) {
    showResult('⚠️', 'エラー', visitError.message, '');
    return;
  }

  showResult('✅', `${inserted.name}さん`, 'ご登録ありがとうございます！入室を記録しました。', now.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' }));
}

document.getElementById('btnRegister').addEventListener('click', submitRegister);
document.getElementById('registerName').addEventListener('keydown', e => {
  if (e.key === 'Enter') submitRegister();
});

async function handleUser(user) {
  if (handled) return;
  handled = true;

  const isLine = user.user_metadata?.provider === 'line';
  let member;

  if (isLine) {
    const lineId = user.user_metadata?.sub;
    ({ data: member } = await sb.from('members').select('*').eq('line_id', lineId).maybeSingle());
  } else {
    ({ data: member } = await sb.from('members').select('*').eq('email', user.email).maybeSingle());
  }

  if (!member) {
    pendingUser = { user, isLine };
    showRegisterForm();
    return;
  }

  if (!member.active) {
    showResult('⚠️', 'ご利用いただけません', 'スタッフへお声がけください。', '');
    return;
  }

  const today = getJSTDateString();
  const { data: activeVisits } = await sb
    .from('visits')
    .select('*')
    .eq('member_id', member.id)
    .eq('date', today)
    .is('exit_time', null);

  if (activeVisits && activeVisits.length > 0) {
    const t = activeVisits[0].enter_time?.slice(0, 5) || '—';
    showResult('☕', `${member.name || member.id}さん`, 'すでに入室記録があります。', `${t} 入室`);
    return;
  }

  const now = new Date();
  const { error } = await sb.from('visits').insert({
    member_id: member.id,
    date: today,
    enter_time: now.toTimeString().split(' ')[0]
  });

  if (error) {
    showResult('⚠️', 'エラー', error.message, '');
    return;
  }

  showResult('✅', `${member.name || member.id}さん`, 'いらっしゃいませ！入室を記録しました。', now.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' }));
}

sb.auth.onAuthStateChange(async (event, session) => {
  if (session && (event === 'SIGNED_IN' || event === 'INITIAL_SESSION')) {
    handleUser(session.user);
  } else if (event === 'INITIAL_SESSION' && !session) {
    showLoginButtons();
  }
});

// 少し待ってセッションが無ければログインボタンを表示（INITIAL_SESSIONが飛ばないケースの保険）
setTimeout(async () => {
  if (handled) return;
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    handleUser(session.user);
  } else {
    showLoginButtons();
  }
}, 800);

document.addEventListener('click', async (e) => {
  if (e.target.closest('#btnGoogle')) {
    showLoading('ログイン処理中...');
    document.getElementById('errorMsg').style.display = 'none';
    const base = location.origin + location.pathname.replace(/\/[^/]*$/, '/');
    const { error } = await sb.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: base + 'checkin.html' }
    });
    if (error) showError('エラー: ' + error.message);
  }
  if (e.target.closest('#btnLine')) {
    showLoading('LINEへ移動中...');
    document.getElementById('errorMsg').style.display = 'none';
    const params = new URLSearchParams({
      response_type: 'code',
      client_id: '2009333479',
      redirect_uri: 'https://ashoqzwxgaovepclbawf.supabase.co/functions/v1/line-callback',
      state: 'checkin.html',
      scope: 'openid profile'
    });
    location.href = 'https://access.line.me/oauth2/v2.1/authorize?' + params.toString();
  }
});
</script>
</body>
</html>
